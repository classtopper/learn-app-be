  /users/signup:
    post:
      tags:
        - Users
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, country]
              properties:
                email:
                  type: string
                password:
                  type: string
                country:
                  type: string
      responses:
        '200':
          description: User created and JWT token returned

  /users/login:
    post:
      tags:
        - Users
      summary: Authenticate user and return JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authentication successful

  /users/check-email:
    get:
      tags:
        - Users
      summary: Check if email already exists
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Whether the email exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean

  /users/verify:
    get:
      tags:
        - Users
      summary: Verify user JWT token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
        '401':
          description: Invalid or missing token

  /users:
    get:
      tags:
        - Users
      summary: Get all users (optionally filter by email)
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    email:
                      type: string
                    country:
                      type: string
                    createdAt:
                      type: string
                      format: date-time

    delete:
      tags:
        - Users
      summary: Delete user (requires token)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User deleted successfully
        '401':
          description: Unauthorized

  /users/forgot-password:
    put:
      tags:
        - Users
      summary: Reset password for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Password updated
        '404':
          description: User not found
